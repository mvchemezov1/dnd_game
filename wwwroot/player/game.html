<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой мир</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="theme-transition">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">⚔️ DnD Game</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" id="nav"></li>
                    <li class="nav-item">
                        <span id="themeTogglePlaceholder"></span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>🎮 Игровой клиент</h1>
        <button class="btn btn-primary mb-3" id="connectBtn">Подключиться к серверу</button>
        <div class="input-group mb-3">
            <input type="text" class="form-control" id="messageInput" placeholder="Введите сообщение...">
            <button class="btn btn-secondary" id="sendBtn">Отправить</button>
        </div>
        <div id="log" class="border p-2" style="height:200px; overflow-y:auto; background: #f8f9fa;"></div>

        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Персонаж</h5>
                        <div id="characterStatus">Не выбран</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Бой</h5>
                        <div id="combatStatus">Не активен</div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Последняя команда</h5>
                        <div id="lastCommandResult">—</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <button class="btn btn-outline-secondary me-2" id="undoBtn">↩️ Undo</button>
            <button class="btn btn-outline-secondary" id="redoBtn">↪️ Redo</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui-helpers.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/websocket-client.js"></script>

    <script>
                requireRole(['Player', 'GameMaster', 'Admin']);
                renderNav('nav');

                let wsClient = null;
                const token = getToken();

                function log(msg) {
                    const div = document.getElementById('log');
                    div.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${msg}</div>`;
                    div.scrollTop = div.scrollHeight;
                }

                function updateCharacterStatus(eventType, data) {
                    const statusDiv = document.getElementById('characterStatus');
                    switch (eventType) {
                        case 'CharacterDamageTaken':
                            statusDiv.innerHTML = `💔 ${data.characterId} получил урон ${data.amount}`;
                            break;
                        case 'CharacterHealed':
                            statusDiv.innerHTML = `❤️ ${data.characterId} исцелён на ${data.amount}`;
                            break;
                        case 'CharacterLevelUp':
                            statusDiv.innerHTML = `⬆️ ${data.characterId} достиг уровня ${data.newLevel}`;
                            break;
                        case 'CharacterCreated':
                            statusDiv.innerHTML = `✨ Создан персонаж ${data.name} (${data.characterId})`;
                            break;
                        default: break;
                    }
                }

                function updateCombatStatus(eventType, data) {
                    const statusDiv = document.getElementById('combatStatus');
                    switch (eventType) {
                        case 'CombatStarted':
                            statusDiv.innerHTML = `⚔️ Бой ${data.combatId} начат (участников: ${data.participants?.length || 0})`;
                            break;
                        case 'CombatTurnStarted':
                            statusDiv.innerHTML = `🔄 Ход: ${data.characterId}`;
                            break;
                        case 'CombatRoundStarted':
                            statusDiv.innerHTML = `🔄 Раунд ${data.round}`;
                            break;
                        case 'CombatEnded':
                            statusDiv.innerHTML = `🏁 Бой завершён`;
                            break;
                        case 'CombatActionTaken':
                            statusDiv.innerHTML = `⚡ ${data.characterId} совершил действие`;
                            break;
                        default: break;
                    }
                }

                function updateLastCommandResult(success, resultJson, errorMessage) {
                    const div = document.getElementById('lastCommandResult');
                    if (success) {
                        div.innerHTML = `✅ Команда выполнена успешно${resultJson ? ': ' + resultJson : ''}`;
                    } else {
                        div.innerHTML = `❌ Ошибка: ${errorMessage || 'неизвестная ошибка'}`;
                    }
                }

                const wsOptions = {
                    onOpen: () => {
                        log('🟢 Соединение установлено');
                        document.getElementById('connectBtn').textContent = 'Отключиться';
                        showToast('Соединение установлено', 'success');
                    },
                    onClose: () => {
                        log('🔴 Соединение закрыто');
                        document.getElementById('connectBtn').textContent = 'Подключиться';
                    },
                    onError: (err) => {
                        log('❌ Ошибка: ' + err.message);
                        showToast('Ошибка WebSocket: ' + err.message, 'error');
                    },
                    onEvent: (eventType, eventData, correlationId) => {
                        log(`📨 Событие ${eventType}${correlationId ? ' (corr: ' + correlationId + ')' : ''}: ` + JSON.stringify(eventData).slice(0, 100));
                        updateCharacterStatus(eventType, eventData);
                        updateCombatStatus(eventType, eventData);
                    },
                    onCommandResponse: (correlationId, success, resultJson, errorMessage) => {
                        log(`📨 Ответ на команду ${correlationId ? '(corr: ' + correlationId + ')' : ''}: ${success ? 'успех' : 'ошибка'}`);
                        updateLastCommandResult(success, resultJson, errorMessage);
                        if (!success) showToast('Ошибка команды: ' + errorMessage, 'error');
                    },
                    onQueryResponse: (correlationId, success, resultJson, errorMessage) => {
                        log(`📨 Ответ на запрос ${correlationId ? '(corr: ' + correlationId + ')' : ''}: ${success ? 'успех' : 'ошибка'}`);
                    },
                    onErrorResponse: (errorCode, message, detail, correlationId) => {
                        log(`❌ Ошибка от сервера [${errorCode}]: ${message}${detail ? ' (' + detail + ')' : ''}`);
                        showToast(`Ошибка: ${message}`, 'error');
                    },
                    onUndoResponse: (isUndo, correlationId, success, errorMessage) => {
                        log(`${isUndo ? '↩️ Undo' : '↪️ Redo'} ${correlationId ? '(corr: ' + correlationId + ')' : ''}: ${success ? 'успех' : 'ошибка' + (errorMessage ? ': ' + errorMessage : '')}`);
                        if (success) showToast(isUndo ? 'Undo выполнен' : 'Redo выполнен', 'success');
                        else showToast('Ошибка ' + (isUndo ? 'Undo' : 'Redo') + ': ' + errorMessage, 'error');
                    }
                };

                document.getElementById('connectBtn').addEventListener('click', () => {
                    if (wsClient && wsClient.connected) {
                        wsClient.disconnect();
                        wsClient = null;
                        return;
                    }
                    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const url = `${protocol}//${location.host}/ws?token=${token}`;
                    wsClient = new WebSocketClient(url, wsOptions);
                    wsClient.connect();
                });

                document.getElementById('sendBtn').addEventListener('click', () => {
                    const input = document.getElementById('messageInput');
                    if (!wsClient || !wsClient.connected) {
                        showToast('Сначала подключитесь', 'warning');
                        return;
                    }
                    const text = input.value.trim();
                    if (!text) return;
                    try {
                        const cmd = JSON.parse(text);
                        if (cmd.commandType && cmd.commandJson) {
                            wsClient.sendCommand(cmd.commandType, cmd.commandJson, cmd.correlationId);
                        } else {
                            // Если нет commandType – пробуем отправить как команду с самим объектом
                            wsClient.send({ type: 'command', payload: cmd });
                        }
                    } catch (e) {
                        // Если не JSON – показываем ошибку, а не отправляем чат
                        showToast('Введите JSON команду', 'warning');
                        log('❌ Неверный формат: ' + text);
                    }
                    input.value = '';
                });

                document.getElementById('messageInput').addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') document.getElementById('sendBtn').click();
                });

                document.getElementById('undoBtn').addEventListener('click', () => {
                    if (wsClient && wsClient.connected) {
                        wsClient.sendUndo();
                    } else {
                        showToast('Сначала подключитесь', 'warning');
                    }
                });

                document.getElementById('redoBtn').addEventListener('click', () => {
                    if (wsClient && wsClient.connected) {
                        wsClient.sendRedo();
                    } else {
                        showToast('Сначала подключитесь', 'warning');
                    }
                });
    </script>
</body>
</html>
