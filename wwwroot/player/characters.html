<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="theme-transition">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">⚔️ DnD Game</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" id="nav"></li>
                    <li class="nav-item">
                        <span id="themeTogglePlaceholder"></span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>🧙 Список персонажей</h1>
            <button class="btn btn-success" id="createBtn">Создать нового персонажа</button>
        </div>
        <div id="error" class="alert alert-danger d-none"></div>
        <ul class="list-group" id="characterList"></ul>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui-helpers.js"></script>
    <script src="/js/auth.js"></script>

    <script>
                requireRole(['Player', 'GameMaster', 'Admin']);
                renderNav('nav');

                async function loadCharacters() {
                    try {
                        const res = await authFetch('/api/characters');
                        if (!res.ok) throw new Error('Не удалось загрузить персонажей');
                        const chars = await res.json();
                        const list = document.getElementById('characterList');
                        if (!Array.isArray(chars) || chars.length === 0) {
                            list.innerHTML = '<li class="list-group-item">Персонажей пока нет</li>';
                            return;
                        }
                        list.innerHTML = chars.map(c => `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <a href="/player/character.html?id=${c.id}" class="text-decoration-none">${c.name}</a>
                                <span class="badge bg-primary rounded-pill">Уровень ${c.level}, ${c.class || 'без класса'}</span>
                            </li>
                        `).join('');
                    } catch (err) {
                        document.getElementById('error').textContent = '❌ ' + err.message;
                        document.getElementById('error').classList.remove('d-none');
                        showToast(err.message, 'error');
                    }
                }

                document.getElementById('createBtn').addEventListener('click', async () => {
                    const name = prompt('Имя персонажа:');
                    if (!name) return;
                    try {
                        const res = await authFetch('/api/characters', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name, maxHitPoints: 10 })
                        });
                        if (!res.ok) throw new Error('Ошибка создания');
                        showToast('Персонаж создан!', 'success');
                        loadCharacters();
                    } catch (err) {
                        showToast(err.message, 'error');
                    }
                });

                loadCharacters();
    </script>
</body>
</html>
