<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="theme-transition">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">⚔️ DnD Game</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" id="nav"></li>
                    <li class="nav-item">
                        <span id="themeTogglePlaceholder"></span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center">📝 Регистрация</h2>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" required>
                                <div class="form-text">Минимум 8 символов, заглавная и строчная буква, цифра, спецсимвол (например: Passw0rd!)</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="confirmPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label">Роль</label>
                                <select class="form-select" id="role">
                                    <option value="Player">Игрок</option>
                                    <option value="GameMaster">Ведущий (ДМ)</option>
                                    <option value="Admin">Администратор сервера</option>
                                </select>
                                <div class="form-text">Роль «Разработчик» через регистрацию не выдаётся — только вручную.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                        </form>
                        <div id="message" class="mt-3 text-center"></div>
                        <p class="mt-3 text-center">Уже есть аккаунт? <a href="/login.html">Войти</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui-helpers.js"></script>
    <script src="/js/auth.js"></script>

    <script>
                renderNav('nav');

                document.getElementById('registerForm').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const username = document.getElementById('username').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirm = document.getElementById('confirmPassword').value;
                    const role = document.getElementById('role').value;
                    const msgDiv = document.getElementById('message');
                    msgDiv.innerHTML = '';

                    if (password !== confirm) {
                        msgDiv.innerHTML = '<div class="alert alert-danger">Пароли не совпадают</div>';
                        showToast('Пароли не совпадают', 'error');
                        return;
                    }

                    try {
                        const res = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, email, password, role })
                        });
                        const data = await res.json();
                        if (!res.ok) throw new Error(data.error || data.message || 'Ошибка регистрации');

                        msgDiv.innerHTML = `<div class="alert alert-success">✅ Регистрация успешна! <a href="/login.html">Перейти ко входу</a></div>`;
                        showToast('Регистрация успешна!', 'success');
                        document.getElementById('registerForm').reset();
                    } catch (err) {
                        msgDiv.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
                        showToast(err.message, 'error');
                    }
                });
    </script>
</body>
</html>
